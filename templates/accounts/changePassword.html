{% extends 'base.html' %}




{% block content %}



<!-- ========================= SECTION CONTENT ========================= -->
<section class="section-conten padding-y bg">

    {% include 'include/alerts.html' %}

<div class="container">
	<div class="row">
	{% include 'include/dashboard_sidebar.html' %}
	<main class="col-md-9">
		<article class="card">
		<header class="card-header">
			<strong class="d-inline-block mr-3"> CHANGE YOUR PASSWORD </strong>
			
		</header>
		<div class="card-body">
			<div class="row"> 
				

				<div class="col-md-12">
					<form method="POST" enctype="multipart/form-data">


						{% csrf_token %}

						

						
						<div class="form-group">
								<label>Current Password</label>
								<input type="password" name="current_password" class="form-control" placeholder="current password" required>
						</div>

						<div class="form-group">
								<label>Create New Password</label>
								<input type="password" name="new_password" class="form-control" placeholder="create new password" required>
						</div>
						
						<div class="form-group">
								<label>Confirm New Password</label>
								<input type="password" name="confirm_password" class="form-control" placeholder="confirm new password" required>
						</div>


						<input type="submit" value="submit"
						style="
						padding:12px 40px;
						font-size:16px;
						font-weight:600;
						border:none;
						border-radius:12px;
						background:linear-gradient(45deg,#ff6a00,#ee0979);
						color:white;
						cursor:pointer;
						transition:0.4s;
						box-shadow:0 4px 10px rgba(0,0,0,0.3);
						"
						onmouseover="this.style.transform='scale(1.08)';this.style.boxShadow='0 6px 20px rgba(255,0,150,0.6)'"
						onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 4px 10px rgba(0,0,0,0.3)'"
						>





							
					</form>
				</div>


				

			</div> <!-- row.// -->
		</div> <!-- card-body .// -->
		</article> <!-- order-group.// --> 
	</main>
</div> <!-- row.// -->
</div>


</section>
<!-- ========================= SECTION CONTENT END// ========================= -->



{% endblock %}
